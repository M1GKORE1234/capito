# How Capito checks itself: AI-written changes to Capito get a Capito quiz.
# Kept here (not in .github/workflows) because GitHub Marketplace actions cannot
# contain workflow files. To run it in a fork, copy it to .github/workflows/.
name: Capito

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: capito-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  capito:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/capito')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '/capito quiz')
        run: npm ci
      - uses: ./
        with:
          test-command: npx vitest run test/core.test.ts
          include: src/**/*.ts
          lang: en
          secret: ${{ secrets.CAPITO_SECRET }}
